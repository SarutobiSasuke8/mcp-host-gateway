# mcp-host-gateway example config.
# Copy to gateway.yaml (git-ignored is wise if you add real hostnames) and point GATEWAY_CONFIG at it.
# No secrets belong in this file. Tokens and upstream credentials come from the environment.

version: 1

listen:
  host: 127.0.0.1   # bind to 0.0.0.0 only behind a TLS-terminating reverse proxy
  port: 8080

# Production: JWT verified against the issuer's JWKS. The token must carry iss, aud, sub and exp.
# The plan is read from the claim named by plan_claim (default "plan").
auth:
  mode: jwt
  issuer: https://accounts.example.com
  audience: mcp-host-gateway
  # jwks_url: https://accounts.example.com/.well-known/jwks.json   # default is <issuer>/.well-known/jwks.json
  # plan_claim: plan
  # default_plan: free        # if omitted, tokens with no plan claim are denied
  # Token freshness (README "Token freshness"): a revoked token stops working within
  # jwks_refresh_seconds; a new one works on its first call, or within jwks_cooldown_seconds.
  # jwks_refresh_seconds: 5
  # jwks_cooldown_seconds: 1
  # jwks_max_stale_seconds: 60   # issuer unreachable this long: calls get 503 until it answers
  # Sent in every 401 so MCP clients can find the sign-in server. {upstream} is the upstream name.
  # resource_metadata_url: https://accounts.example.com/.well-known/oauth-protected-resource/mcp/{upstream}

# Development and tests: opaque tokens from an env var, never from this file.
#   GATEWAY_STATIC_TOKENS=dev-free-token-0123456789:dev-free:free,dev-paid-token-0123456789:dev-paid:paid
# auth:
#   mode: static
#   tokens_env: GATEWAY_STATIC_TOKENS

upstreams:
  jobscout:
    # JobScout's Streamable HTTP entrypoint (jobscout-mcp-http). The names below are exactly what
    # JobScout's tools/list and prompts/list return (jobscout-mcp main, src/server.ts). Check them
    # against a live tools/list and prompts/list before changing them: a name JobScout does not
    # expose is simply never reachable, and a missing one is denied.
    url: https://jobscout.internal/mcp
    tools_allow:
      - jobscout_list_sources
      - jobscout_search_jobs
      - jobscout_classify_jobs
      - jobscout_deduplicate
      - jobscout_source_yield
      - jobscout_briefing
    # Prompts are deny by default. Without prompts_allow, prompts/* is not routed for this
    # upstream and the prompts capability is not advertised.
    prompts_allow: [jobscout_setup, jobscout_find_jobs]
    # JobScout exposes no resources, so there is no resources_allow here: resources/* is not
    # routed for this upstream and the resources capability is not advertised.
    # auth_header_env: JOBSCOUT_UPSTREAM_AUTH   # env var holding the full Authorization header value
    # timeout_ms: 30000
  source_pack:
    # Illustrative sibling upstream (not JobScout). No prompts_allow, so no prompts are routed.
    url: https://source-pack.internal/mcp
    tools_allow: [list_sources, fetch_source]
    # Resources are deny by default too. resources_allow is a list of URI prefixes (plain string
    # prefixes, no template braces): resources/list and resources/templates/list are filtered to
    # them, resources/read outside them is forbidden, and resources/subscribe is never routed.
    # End each prefix at a boundary the upstream's URIs respect, usually a trailing slash.
    resources_allow: ["docs://public/", "sources://catalogue/"]

entitlements:
  free:
    upstreams: [jobscout]
    rpm: 30
    # Optional narrowing below the upstream allow lists. Free callers get search and the
    # onboarding prompts; the bulk transforms are paid.
    tools:
      jobscout: [jobscout_list_sources, jobscout_search_jobs, jobscout_briefing]
    prompts:
      jobscout: [jobscout_setup, jobscout_find_jobs]   # [] would mean no prompts on this plan
  paid:
    upstreams: [jobscout, source_pack]
    rpm: 300
    # A plan may narrow an upstream's resources_allow to prefixes inside it. Absent means all of
    # resources_allow; [] would mean no resources on this plan.
    # resources:
    #   source_pack: ["docs://public/"]

rate:
  scope: identity   # or identity_upstream for one bucket per caller per upstream
  # memory: one process, reset on restart (dev and tests).
  # sqlite: WAL-mode file shared by every gateway process on this host and kept across restarts.
  store: sqlite
  sqlite_path: ./data/rate.sqlite

# Audit trail: one JSON line per routed call, separate from the operational log on stdout.
# No bodies, no tokens. Schema in README "Audit log".
audit:
  sink: file        # or stderr
  path: ./data/audit.jsonl
